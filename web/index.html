<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bizz Buzz">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" href="bizzbuzz.png" sizes="any"/>
  

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Bizz Buzz" />
  <meta property="og:description" content="small business social community application" />
  <meta property="og:image" content="/assets/assets/images/bizzbuzzbee.png" /> 
  <meta name="twitter:title" content="Bizz Buzz" />
  <meta name="twitter:description" content="small business social community application" />
  <meta name="twitter:image" content="/assets/assets/images/bizzbuzzbee.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> Bizz Buzz </title>
  <meta name="description" content="small business social community application" />
    

  

  <link rel="manifest" href="manifest.json">
  
</head>
<body>
  
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCJ9ieEPsC_q-CvgS4yYU5L_8Astad4eVY"></script>
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
